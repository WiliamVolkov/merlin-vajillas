{% extends "base.html" %}{% block content %}<div class="page-title"><p class="eyebrow">PANEL PRIVADO</p><h1>Productos</h1></div><form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Agregar producto</h2><label>Nombre<input name="name" required></label><label>Descripción<textarea name="description"></textarea></label><div class="two"><label>Precio por unidad<input type="number" name="price" min="0" step="0.01" required></label><label>Stock total<input type="number" name="stock" min="0" required></label></div><label>Categoría<select name="category_id"><option value="">Sin categoría</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>URL de imagen<input name="image_url" placeholder="https://..."></label><button class="btn dark">Guardar producto</button></form><h2>Productos cargados</h2>{% for p in products %}<article class="request-card"><div><strong>{{ p.name }}</strong><p>${{ p.price }} · Stock: {{ p.stock }} · {{ 'Activo' if p.active else 'Oculto' }}</p></div><form method="post" action="{{ url_for('admin.delete_product', product_id=p.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn small">Ocultar</button></form></article>{% endfor %}{% endblock %}
